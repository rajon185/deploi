x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: deploi-php
  volumes:
    - .:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  app:
    <<: *php
    environment:
      ROLE: app

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8090}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  queue:
    <<: *php
    environment:
      ROLE: worker
    # Long timeout: provisioning a fresh server can take 10-15 minutes. Several workers so a
    # long provision doesn't block deployments or quick tasks.
    command: php artisan queue:work --queue=deployments,default,provisioning --timeout=3700 --tries=1 --sleep=1
    deploy:
      replicas: 3

  scheduler:
    <<: *php
    environment:
      ROLE: worker
    command: php artisan schedule:work

  assets:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npx vite build --watch"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: deploi
      MYSQL_USER: deploi
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "${FORWARD_DB_PORT:-33060}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  # Optional local test target: a systemd Ubuntu 24.04 box with sshd.
  # Start with: docker compose --profile sandbox up -d sandbox
  # Add it in Deploi as a "Custom server" with IP "sandbox" and port 22.
  sandbox:
    profiles: ["sandbox"]
    build:
      context: docker/sandbox
    image: deploi-sandbox
    hostname: sandbox
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "${SANDBOX_HTTP_PORT:-8081}:80"
      - "${SANDBOX_SSH_PORT:-2222}:22"

volumes:
  mysql-data:
  redis-data:
